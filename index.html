<style>
/* 브랜드 색 = 릴스·카드 디자인 A "크림 노트" (크림 종이 + 남색 글자 + 노랑·산호 포인트) */
:root {
  --bg: #fbf6ea; --surface: #ffffff; --soft: #f4ecd8; --fg: #1e264e; --muted: #6b6e88; --line: #e8dfc8;
  --yellow: #ffc43d; --coral: #e85d4a; --green: #2f9e78; --purple: #965ac8;
  --c1: #ffc43d; --c1-ink: #3a2a00; --c2: #f078be; --c2-ink: #ffffff;
  --b1: #6cb6f2; --b1-ink: #0b2440; --b2: #4fd1b0; --b2-ink: #06322a;
  --mark: #ffe28a; --mark-ink: #1e264e; --link: #2f46c9; --focus: #2f46c9;
  --nav-bg: rgba(251, 246, 234, .86); --shadow: 0 1px 2px rgba(30, 38, 78, .06), 0 8px 24px rgba(30, 38, 78, .06);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #12162e; --surface: #1a1f3d; --soft: #20264a; --fg: #f1f0ea; --muted: #a3a6c4; --line: #2c3360;
  --c1: #ffd166; --c2: #f59bd0; --c2-ink: #2a0a1c; --b1: #8cc4ff; --b2: #5ee0b6;
  --mark: #6a5414; --mark-ink: #fff1c4; --link: #a6b4ff; --focus: #a6b4ff;
  --nav-bg: rgba(18, 22, 46, .86); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark } }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.65; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.container { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 맨 위 메뉴 줄 */
.topbar { height: 6px; background: var(--yellow); }
.nav { position: sticky; top: 0; z-index: 30; background: var(--nav-bg); backdrop-filter: saturate(1.4) blur(10px);
  -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.nav .container { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: -.01em; }
.brand img { width: 38px; height: 38px; }
.nav-links { display: flex; align-items: center; gap: 6px; }
.nav-links a { text-decoration: none; font-weight: 500; font-size: 15px; padding: 8px 12px; border-radius: 999px; }
.nav-links a:hover { background: var(--soft); }
.nav-links a.cta { background: var(--fg); color: var(--bg); font-weight: 700; }
.nav-links a.cta:hover { background: var(--coral); color: #fff; }
.nav-links .hide-sm { display: inline; }

/* 첫 화면 */
.hero { padding: 56px 0 40px; }
.hero .container { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; }
.hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(38px, 7.4vw, 72px); line-height: 1.05; letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.hero h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--yellow) 62%); padding: 0 4px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; box-shadow: var(--shadow); }
.stat b { display: block; font-family: var(--display); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.hero-sun { width: clamp(120px, 22vw, 230px); height: auto; animation: float 6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-8px) rotate(4deg); } }
@media (prefers-reduced-motion: reduce) { .hero-sun { animation: none; } html { scroll-behavior: auto; } }

/* 걸러 보기·검색 줄 (메뉴 아래에 붙어 따라옴) */
.toolbar { position: sticky; top: 64px; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 0; }
.toolbar .container { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 4px; gap: 2px; }
.seg button { font: 700 14px var(--body); border: 0; background: none; color: var(--muted); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(30, 38, 78, .15); }
.search { flex: 1 1 220px; min-width: 0; position: relative; }
.search input { width: 100%; font: 15px var(--body); padding: 9px 16px 9px 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--muted); }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.jump a { font-size: 13px; font-weight: 500; text-decoration: none; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.jump a:hover { border-color: var(--fg); }

/* 영상별 묶음 */
main { padding: 8px 0 72px; }
section.news { margin-top: 40px; scroll-margin-top: 190px; }
.news-head { display: flex; flex-wrap: wrap; gap: 14px 24px; justify-content: space-between; align-items: end;
  background: var(--fg); color: var(--bg); border-radius: 20px; padding: 24px 26px; position: relative; overflow: hidden; }
.news-head::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: var(--yellow); opacity: .18; }
.news-head > div { min-width: 0; display: grid; gap: 4px; position: relative; z-index: 1; }
.eyebrow { font-size: 13px; font-weight: 500; opacity: .75; letter-spacing: .02em; }
h2 { font-family: var(--display); font-weight: 800; font-size: clamp(26px, 4.4vw, 38px); line-height: 1.1; margin: 0; }
.ntitle { margin: 0; font-size: 14px; opacity: .75; overflow-wrap: anywhere; }
.news-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.news-meta .count { color: inherit; opacity: .75; }
.watch { font-weight: 700; font-size: 14px; color: var(--fg); background: var(--yellow); text-decoration: none; padding: 8px 16px; border-radius: 999px; }
.watch:hover { background: #fff; }
.watch.none { background: none; color: inherit; opacity: .7; font-weight: 500; padding: 0; }
h3.bandhead { display: flex; align-items: center; gap: 10px; font: 700 16px var(--body); margin: 30px 0 12px; }
h3.bandhead::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* 표현 카드 */
ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
li { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 10px 32px; padding: 24px 26px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
li:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(30, 38, 78, .06), 0 14px 32px rgba(30, 38, 78, .1); }
.head { display: grid; gap: 10px; align-content: start; min-width: 0; }
.word { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.15; overflow-wrap: anywhere; }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.no { font-size: 12px; font-weight: 700; color: #fff; background: var(--coral); padding: 2px 9px; border-radius: 999px; }
.lvl { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--c1); color: var(--c1-ink); }
.lvl.C2 { background: var(--c2); color: var(--c2-ink); }
.lvl.B1 { background: var(--b1); color: var(--b1-ink); }
.lvl.B2 { background: var(--b2); color: var(--b2-ink); }
.ts { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.body { display: grid; gap: 10px; min-width: 0; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; padding: 1px 8px; border-radius: 6px; margin-right: 8px; vertical-align: 2px; }
.tag.m { background: var(--green); } .tag.e { background: var(--coral); } .tag.s { background: var(--purple); }
.meaning { font-weight: 700; font-size: 19px; }
.ex { margin: 0; font-size: 16px; }
.ex mark { background: var(--mark); color: var(--mark-ink); padding: 0 3px; border-radius: 3px; font-weight: 700; }
.ex .w { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
.ex .w:hover, .ex .w[aria-expanded="true"] { color: var(--link); }
.ko { margin: 0; color: var(--muted); font-size: 15px; }
.syn { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; margin: 0; background: var(--soft); border-radius: 10px; padding: 10px 14px; }
.syn dt { font-size: 12px; font-weight: 700; color: var(--muted); padding-top: 1px; }
.syn dd { margin: 0; }
.empty { padding: 60px 0; text-align: center; color: var(--muted); }

/* 단어 풀이 팝업 */
.pop { position: fixed; z-index: 40; width: min(340px, calc(100vw - 32px)); background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: 0 12px 36px rgba(10, 12, 30, .25); display: grid; gap: 6px; }
.pop[hidden] { display: none; }
.pop .lemma { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.2; }
.pop .pos { font-size: 12px; color: var(--muted); }
.pop .ko { color: var(--fg); font-weight: 700; font-size: 16px; }
.pop .syn { background: none; padding: 0; }
.pop .close { position: absolute; top: 6px; right: 10px; font: 22px var(--body); background: none; border: 0; color: var(--muted); cursor: pointer; }
.pop .from { font-size: 13px; color: var(--muted); }

/* 맨 아래 */
footer { background: var(--fg); color: var(--bg); padding: 44px 0 36px; }
footer .container { display: grid; gap: 18px; }
footer .brand { color: var(--bg); }
footer p { margin: 0; font-size: 14px; opacity: .78; max-width: 640px; }
footer .links { display: flex; flex-wrap: wrap; gap: 10px; }
footer .links a { font-size: 14px; font-weight: 700; text-decoration: none; padding: 8px 16px; border-radius: 999px; background: var(--yellow); color: #1e264e; }
footer small { font-size: 12px; opacity: .6; }
.totop { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 20px; z-index: 25; width: 46px; height: 46px; border-radius: 50%;
  border: 0; background: var(--fg); color: var(--bg); font-size: 20px; cursor: pointer; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s; }
.totop.show { opacity: 1; pointer-events: auto; }

@media (max-width: 680px) {
  li { grid-template-columns: minmax(0, 1fr); padding: 20px; }
  .hero { padding: 36px 0 28px; }
  .hero .container { grid-template-columns: minmax(0, 1fr); }
  .hero-sun { position: absolute; right: 12px; top: 84px; width: 92px; opacity: .95; }
  .nav-links .hide-sm { display: none; }
  .news-head { padding: 20px; }
}
</style>
</head>

const LEVELS = ["B1", "B2", "C1", "C2"];  // 단어장에서 보여 주는 레벨 순서
const ARTICLES = new Set(["el","la","los","las","un","una","de","a","con","por"]);
const plain = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 예문을 단어 단위로 나눠 모든 단어를 누를 수 있는 버튼으로 만든다. 단어장 표현에 해당하는 단어는 형광펜 표시.
function highlight(example, word) {
  const keys = plain(word.replace(/[()]/g, "")).split(/[^\p{L}]+/u)
    .filter(t => t.length > 2 && !ARTICLES.has(t)).map(t => t.slice(0, 5));
  return example.split(/(\p{L}+)/u).map(tok => {
    if (!/^\p{L}+$/u.test(tok)) return esc(tok);
    const btn = `<button type="button" class="w" data-w="${esc(tok.toLowerCase())}" aria-haspopup="dialog" aria-expanded="false">${esc(tok)}</button>`;
    return keys.some(k => plain(tok).startsWith(k)) ? `<mark>${btn}</mark>` : btn;
  }).join("");
}

// 단어 풀이 카드
const pop = document.getElementById("pop");
let openBtn = null;
function closePop() {
  pop.hidden = true;
  if (openBtn) { openBtn.setAttribute("aria-expanded", "false"); openBtn = null; }
}
function showPop(btn) {
  const form = btn.dataset.w, lemma = GLOSS.forms[form] || form, e = GLOSS.lemmas[lemma];
  pop.innerHTML = `<button type="button" class="close" aria-label="닫기">×</button>` + (e
    ? `<div class="lemma" lang="es">${esc(lemma)}</div><div class="pos">${esc(e[0])}</div>
       ${form !== lemma ? `<div class="from">예문 속 형태: <span lang="es">${esc(form)}</span></div>` : ""}
       <div class="ko">${esc(e[1])}</div>
       ${e[2].length || e[3].length ? `<dl class="syn">
         ${e[2].length ? `<dt>ES</dt><dd lang="es">${esc(e[2].join(" · "))}</dd>` : ""}
         ${e[3].length ? `<dt>EN</dt><dd lang="en">${esc(e[3].join(" · "))}</dd>` : ""}</dl>` : ""}`
    : `<div class="lemma" lang="es">${esc(form)}</div><div class="from">아직 풀이가 없는 단어예요.</div>`);
  pop.hidden = false;
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  const left = Math.min(Math.max(16, r.left + r.width / 2 - w / 2), innerWidth - w - 16);
  const top = r.bottom + 8 + h > innerHeight - 8 ? Math.max(8, r.top - h - 8) : r.bottom + 8;
  pop.style.left = left + "px";
  pop.style.top = top + "px";
  btn.setAttribute("aria-expanded", "true");
  openBtn = btn;
  pop.querySelector(".close").focus({ preventScroll: true });
}
document.addEventListener("click", ev => {
  const btn = ev.target.closest(".ex .w");
  if (btn) { const same = btn === openBtn; closePop(); if (!same) showPop(btn); return; }
  if (ev.target.closest(".close") || !ev.target.closest("#pop")) closePop();
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && openBtn) { const b = openBtn; closePop(); b.focus(); }
});
const totop = document.getElementById("totop");
addEventListener("scroll", () => { closePop(); totop.classList.toggle("show", scrollY > 600); }, { passive: true });
totop.addEventListener("click", () => scrollTo({ top: 0 }));

function row(it) {
  return `<li>
    <div class="head">
      <div class="word" lang="es">${esc(it.word)}</div>
      <div class="meta"><span class="no">No.${it.no}</span><span class="lvl ${it.level}">${it.level}</span><span class="ts">${esc(it.example_made ? "일반 예문" : (it.timestamp || ""))}</span></div>
    </div>
    <div class="body">
      <div class="meaning"><span class="tag m">뜻</span>${esc(it.meaning_ko)}</div>
      <p class="ex" lang="es"><span class="tag e">예문</span>${highlight(it.example, it.word)}</p>
      ${it.example_ko ? `<p class="ko">${esc(it.example_ko)}</p>` : ""}
      <dl class="syn">
        <dt>ES</dt><dd lang="es">${esc(it.synonyms_es.join(" · "))}</dd>
        <dt>EN</dt><dd lang="en">${esc(it.synonyms_en.join(" · "))}</dd>
      </dl>
    </div>
  </li>`;
}

function section(n, items) {
  const watch = n.url
    ? `<a class="watch" href="${esc(n.url)}" target="_blank" rel="noopener">영상 보기 ↗</a>`
    : `<span class="watch none">영상 링크 준비 중</span>`;
  return `<section class="news" id="${n.anchor}" aria-labelledby="${n.anchor}-h">
    <div class="news-head">
      <div>
        <div class="eyebrow">${esc(n.channel)} · ${esc(n.date)}</div>
        <h2 id="${n.anchor}-h">${esc(n.label)}</h2>
        ${n.title ? `<p class="ntitle" lang="es">${esc(n.title)}</p>` : ""}
      </div>
      <div class="news-meta"><span class="count">${items.length} / ${n.items.length}개</span>${watch}</div>
    </div>
    ${LEVELS.map(lv => {
      const part = items.filter(it => it.level === lv);
      if (!part.length) return "";
      // 여러 레벨이 함께 있을 때만 레벨 소제목을 단다
      const head = items.some(it => it.level !== lv) ? `<h3 class="bandhead"><span class="lvl ${lv}">${lv}</span>${lv} 표현</h3>` : "";
      return head + `<ol>${part.map(row).join("")}</ol>`;
    }).join("")}
  </section>`;
}

const jump = document.getElementById("jump");
// 바로가기 버튼은 채널 이름만. 같은 채널 영상이 여러 개면 날짜를 붙여 구분한다.
const perChannel = {};
NEWS.forEach(n => { perChannel[n.channel] = (perChannel[n.channel] || 0) + 1; });
NEWS.forEach(n => {
  const text = perChannel[n.channel] > 1 ? `${n.channel} ${n.date}` : (n.channel || n.label);
  jump.insertAdjacentHTML("beforeend", `<a href="#${n.anchor}">${esc(text)}</a>`);
});

let level = "";
const list = document.getElementById("list"), q = document.getElementById("q");
const total = NEWS.reduce((s, n) => s + n.items.length, 0);
function render() {
  const term = plain(q.value.trim());
  const match = it => (!level || it.level === level) &&
    (!term || plain(it.word + " " + it.meaning_ko + " " + it.synonyms_es.join(" ") + " " + it.synonyms_en.join(" ")).includes(term));
  let shown = 0;
  const html = NEWS.map(n => {
    const items = n.items.filter(match);
    shown += items.length;
    return items.length ? section(n, items) : "";
  }).join("");
  list.innerHTML = shown ? html : `<p class="empty">맞는 표현이 없습니다.</p>`;
  document.getElementById("count").textContent = `${shown} / ${total}개`;
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  level = b.dataset.level;
  document.querySelectorAll(".seg button").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  render();
}));
q.addEventListener("input", render);
render();
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
